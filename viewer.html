<style>
  :root{
    --ink:#191919; --paper:#ffffff;
    --line:rgba(25,25,25,.14); --line-strong:rgba(25,25,25,.30);
    --muted:rgba(25,25,25,.55); --panel:rgba(255,255,255,.90);
    --radius:2px;
    --font:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#0d0d0d;font-family:var(--font);color:var(--ink);}
  #pano{position:absolute;inset:0;background:#0d0d0d;touch-action:none;}
  #pano canvas{outline:none;touch-action:none;}

  .topbar{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:14px;padding:16px 18px;pointer-events:none;}
  .bar-chip{display:inline-flex;align-items:stretch;gap:12px;padding:8px 13px;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--radius);pointer-events:auto;min-width:0;flex:1 1 auto;overflow:hidden;}
  .logo-link{display:inline-flex;align-items:center;flex:none;}
  .logo{height:16.5px;width:auto;color:var(--ink);display:block;}
  .bar-div{width:1px;align-self:stretch;background:var(--line-strong);flex:none;}
  .proj-toggle{display:flex;flex-direction:column;gap:2px;align-items:flex-start;justify-content:center;flex:1 1 auto;min-width:0;padding:0;margin:0;border:none;background:none;font-family:var(--font);text-align:left;cursor:default;}
  .proj-toggle.switchable{cursor:pointer;}
  .proj-toggle:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .proj-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:none;line-height:1;}
  .proj-toggle.switchable .proj-label{display:block;}
  .proj-current{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:none;line-height:1.1;}
  .proj-toggle.switchable .proj-current::after{content:"\25BE";font-size:20px;line-height:1;color:var(--muted);flex:none;transform:translateY(-3px);}

  .controls{position:absolute;right:18px;bottom:18px;z-index:20;display:flex;gap:8px;pointer-events:auto;}
  .btn{-webkit-appearance:none;appearance:none;cursor:pointer;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);transition:background .15s ease,border-color .15s ease,transform .05s ease;}
  .btn:hover{background:#fff;border-color:var(--line-strong);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .btn svg{width:18px;height:18px;display:block;}
  .btn.is-active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn[hidden]{display:none;}

  .scenes{position:absolute;left:18px;bottom:18px;z-index:20;display:flex;gap:8px;max-width:calc(100vw - 120px);overflow-x:auto;padding:4px;pointer-events:auto;scrollbar-width:thin;}
  .scenes[hidden]{display:none;}
  .scenes::-webkit-scrollbar{height:6px;}
  .scenes::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px;}
  .thumb{flex:none;width:96px;height:60px;border-radius:var(--radius);cursor:pointer;background-size:cover;background-position:center;background-color:#222;border:1px solid var(--line);filter:grayscale(1) contrast(1.02);opacity:.7;transition:opacity .15s ease,border-color .15s ease,filter .2s ease;position:relative;overflow:hidden;}
  .thumb:hover{opacity:1;filter:grayscale(0);}
  .thumb.is-current{opacity:1;filter:grayscale(0);border:1.5px solid var(--ink);}
  .thumb .lbl{position:absolute;left:4px;top:4px;min-width:17px;height:17px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:#fff;background:rgba(25,25,25,.72);border-radius:2px;}

  .msg{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--paper);color:var(--ink);text-align:center;padding:32px;}
  .msg[hidden]{display:none;}
  .msg .logo-lg{height:30px;width:auto;color:var(--ink);margin-bottom:4px;}
  .msg h1{margin:0;font-size:16px;font-weight:600;}
  .msg p{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted);max-width:340px;}

  .projects-menu{position:absolute;left:18px;top:64px;z-index:41;min-width:180px;max-width:calc(100vw - 36px);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--radius);padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.16);pointer-events:auto;}
  .projects-menu[hidden]{display:none;}
  .projects-menu .mh{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:5px 10px 7px;}
  .proj-item{display:block;padding:9px 11px;font-size:12.5px;color:var(--ink);text-decoration:none;border-radius:var(--radius);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .proj-item:hover{background:rgba(25,25,25,.06);}
  .proj-item.current{font-weight:600;background:var(--ink);color:#fff;}
  .loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.45);padding:8px 16px;border-radius:var(--radius);opacity:0;transition:opacity .15s ease;pointer-events:none;}
  .loading.show{opacity:1;}

  /* First-open "swipe to look around" hint (touch devices only) — animated gif, no background */
  .swipe-hint{position:absolute;inset:0;z-index:16;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .6s ease;}
  .swipe-hint[hidden]{display:none;}
  .swipe-hint.show{opacity:1;}
  .swipe-hint-inner{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .swipe-gif{width:36px;height:36px;display:block;}
  .swipe-hint span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;}

  /* Phones (default above): chip stretches full width. Desktop/tablet: compact box, top-left. */
  @media (min-width:768px){
    .bar-chip{flex:0 0 auto;}       /* hug content instead of filling the bar */
    .proj-current{max-width:420px;} /* guard against an unusually long name */
  }
</style>
</head>

  <svg class="logo-lg" viewBox="0 0 1280 200" role="img" aria-label="Space & Matter"><use href="#sm-logo"/></svg>
  <h1 id="msgTitle">No tour configured</h1>
  <p id="msgText">This viewer needs a <code>config.js</code> produced by the Space&amp;Matter admin page.</p>
</div>

<script src="marzipano.js"></script>
<script>
(function(){
  // Load the tour named by ?tour= (e.g. viewer.html?tour=zeist -> zeist.js); else config.js.
  // This lets one folder hold many tours — one config file each, each with its own QR.
  var _p=new URLSearchParams(location.search);
  var _t=(_p.get('tour')||'').replace(/[^A-Za-z0-9_-]/g,'');
  var _cfg=_t ? _t+'.js' : 'config.js';
  if(window.TOUR){ init(); return; }   // config already inlined (e.g. a single-file / baked build)
  function _load(src, ok, err){ var s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=err; document.head.appendChild(s); }
  // Optional tours.js (project menu) first, then the tour config, then start.
  _load('tours.js', _afterTours, _afterTours);
  function _afterTours(){ _load(_cfg, init, _cfgErr); }
  function _cfgErr(){
    var m=document.getElementById('msg'); m.hidden=false;
    document.getElementById('msgTitle').textContent='Tour not found';
    document.getElementById('msgText').textContent='Could not load "'+_cfg+'". Check the file is next to this page.';
  }

  function init(){
  "use strict";
  var DEG=Math.PI/180;
  function deg(d){return d*DEG;}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

  var panoEl=document.getElementById('pano'),
      scenesEl=document.getElementById('scenes'),
      loadingEl=document.getElementById('loading'), msgEl=document.getElementById('msg');

  var TOUR = window.TOUR;
  if(!TOUR){ msgEl.hidden=false; return; }
  // A tour with no scenes yet (placeholder) still shows its name + switcher and a
  // "Coming soon" message — handled at boot below.
  document.getElementById('projectName').textContent = TOUR.title || '';

  // View limits: tour-level values are the default; each scene may override with its own `settings`.
  var DEF = { fovMin:30, fovMax:100, yawLimited:false, yawRange:180, pitchLimited:false, pitchUp:60, pitchDown:60 };
  var TOURDEF = Object.assign({}, DEF, TOUR.settings||{});
  function sceneSettings(cfg){ return Object.assign({}, TOURDEF, cfg.settings||{}); }

  var viewer=new Marzipano.Viewer(panoEl,{controls:{mouseViewMode:'drag'}});
  // Replace Marzipano's Hammer pinch (unreliable on mobile) with our own — see below.
  try{ viewer.controls().disableMethod('pinch'); }catch(e){}
  var scenes=[], current=-1;

  function makeLimiter(S, w, yawCenterRad){
    var L=Marzipano.RectilinearView.limit;
    var parts=[ L.vfov(deg(S.fovMin),deg(S.fovMax)), L.hfov(deg(1),deg(150)) ];
    // (no resolution cap — the Zoom-in limit fully controls how far you can zoom)
    if(S.yawLimited){ var half=deg(S.yawRange)/2; parts.push(L.yaw(yawCenterRad-half, yawCenterRad+half)); }
    else parts.push(L.pitch(-Math.PI/2,Math.PI/2));
    if(S.pitchLimited) parts.push(L.pitch(-deg(S.pitchUp),deg(S.pitchDown)));
    else if(S.yawLimited) parts.push(L.pitch(-Math.PI/2,Math.PI/2));
    return Marzipano.util.compose.apply(null,parts);
  }
  function startFov(S){ return deg(clamp(75,S.fovMin,S.fovMax)); }
  function showLoading(on){ loadingEl.classList.toggle('show',on); }

  function buildScene(cfg){
    return new Promise(function(resolve){
      var img=new Image();
      img.onload=function(){
        var w=img.naturalWidth||4096;
        var frontYaw=deg((cfg.front&&cfg.front.yaw)||0);
        var frontPitch=deg((cfg.front&&cfg.front.pitch)||0);
        var geometry=new Marzipano.EquirectGeometry([{width:w}]);
        var source=Marzipano.ImageUrlSource.fromString(cfg.file);
        var st=sceneSettings(cfg);
        var view=new Marzipano.RectilinearView({yaw:frontYaw,pitch:frontPitch,fov:startFov(st)}, makeLimiter(st,w,frontYaw));
        var marzScene=viewer.createScene({source:source,geometry:geometry,view:view,pinFirstLevel:true});
        scenes.push({id:cfg.id,name:cfg.name||cfg.id,marzScene:marzScene,view:view,thumbUrl:cfg.file,
                     front:{yaw:frontYaw,pitch:frontPitch}, settings:st});
        resolve();
      };
      img.onerror=function(){ resolve(); };
      img.src=cfg.file;
    });
  }

  function goTo(i){
    if(i<0||i>=scenes.length)return; current=i;
    scenes[i].marzScene.switchTo({transitionDuration:600});
    renderScenes();
  }
  function renderScenes(){
    if(scenes.length<2){ scenesEl.hidden=true; scenesEl.innerHTML=''; return; }
    scenesEl.hidden=false; scenesEl.innerHTML='';
    scenes.forEach(function(s,i){
      var t=document.createElement('div');
      t.className='thumb'+(i===current?' is-current':'');
      t.style.backgroundImage='url('+s.thumbUrl+')';
      t.innerHTML='<span class="lbl">'+(i+1)+'</span>';
      t.addEventListener('click',function(){goTo(i);});
      scenesEl.appendChild(t);
    });
  }

  // Controls (guest set — no view-setting changes). Arrow keys hop between scenes.
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'&&scenes.length>1)goTo((current+1)%scenes.length);
    else if(e.key==='ArrowLeft'&&scenes.length>1)goTo((current-1+scenes.length)%scenes.length);
  });

  // ---------- Project switcher (top-left toggle, from optional tours.js) ----------
  (function(){
    var list=window.TOURS;
    if(!list || list.length<2) return;   // single project → just the name, no menu
    var toggle=document.getElementById('projToggle'), menu=document.getElementById('projectsMenu');
    toggle.classList.add('switchable');
    menu.innerHTML='';
    list.forEach(function(t){
      var a=document.createElement('a');
      a.className='proj-item'+(t.id===_t?' current':'');
      a.textContent=t.name||t.id;
      if(t.url){ a.href=t.url; a.target='_top'; }   // go to the project's own page (breaks out of the iframe)
      else { a.href='viewer.html?tour='+encodeURIComponent(t.id); }  // fallback: swap the tour within this frame
      menu.appendChild(a);
    });
    // Align the menu's left edge under the project name (the toggle), not the logo.
    var topbar=document.querySelector('.topbar');
    function positionMenu(){
      var t=toggle.getBoundingClientRect(), b=topbar.getBoundingClientRect();
      menu.style.left=(t.left-b.left)+'px';
      menu.style.top=(t.bottom-b.top+12)+'px';
    }
    toggle.addEventListener('click',function(ev){ ev.stopPropagation(); var open=menu.hidden; if(open) positionMenu(); menu.hidden=!open; toggle.setAttribute('aria-expanded',String(open)); });
    window.addEventListener('resize',function(){ if(!menu.hidden) positionMenu(); });
    document.addEventListener('click',function(e){ if(!menu.hidden && !menu.contains(e.target) && !toggle.contains(e.target)){ menu.hidden=true; toggle.setAttribute('aria-expanded','false'); } });
  })();

  // ---------- Robust two-finger pinch-zoom (works on iOS & Android) ----------
  (function(){
    var startDist=0, startFov=0;
    function twoDist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
    panoEl.addEventListener('touchstart', function(e){
      if(e.touches.length===2 && current>=0){ startDist=twoDist(e.touches); startFov=scenes[current].view.fov(); }
    }, {passive:false});
    panoEl.addEventListener('touchmove', function(e){
      if(e.touches.length===2 && startDist>0 && current>=0){
        var d=twoDist(e.touches);
        if(d>0) scenes[current].view.setFov(startFov*startDist/d);  // limiter clamps to your zoom range
        e.preventDefault();
      }
    }, {passive:false});
    function end(e){ if(!e.touches || e.touches.length<2) startDist=0; }
    panoEl.addEventListener('touchend', end);
    panoEl.addEventListener('touchcancel', end);
    // Stop iOS Safari's own pinch-to-zoom from hijacking the gesture
    ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
      document.addEventListener(ev, function(e){ e.preventDefault(); }, {passive:false});
    });
  })();

  // First-open "swipe to look around" hint — touch devices only, once per session.
  // Fades IN over the loading screen (before the panorama appears); the auto-hide
  // countdown is armed later (armSwipeHintTimeout) once the image is actually shown,
  // so it lingers ~2.6s over the loaded view, or vanishes the moment a drag starts.
  var _hintEl=document.getElementById('swipeHint'), _hintOn=false, _hintDone=false, _hintTimer=null, _hintShownAt=0;
  function hideSwipeHint(){ if(_hintDone||!_hintOn) return; _hintDone=true; clearTimeout(_hintTimer); _hintEl.classList.remove('show'); setTimeout(function(){ _hintEl.hidden=true; },700); }
  function showSwipeHint(){
    var isTouch=(navigator.maxTouchPoints>0)||('ontouchstart' in window);
    if(!isTouch || !_hintEl) return false;
    // Show on every project page load (a project switch is always a fresh load).
    // Scene switches don't reload, so they never trigger this — no persistence needed.
    _hintOn=true; _hintShownAt=Date.now(); _hintEl.hidden=false;
    // The gif plays once (no loop flag). Give it a unique URL each time the hint shows
    // so a project switch re-decodes it from frame 0 instead of showing the cached,
    // frozen last frame.
    var _gif=_hintEl.querySelector('.swipe-gif');
    if(_gif) _gif.src='swipe-hint.gif?_='+Date.now();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ if(_hintOn && !_hintDone) _hintEl.classList.add('show'); }); });
    panoEl.addEventListener('touchstart', hideSwipeHint, {once:true, passive:true});
    return true;
  }
  function armSwipeHintTimeout(){ if(_hintOn && !_hintDone) _hintTimer=setTimeout(hideSwipeHint, 2600); }

  // Boot: load all scenes, open the one named by ?start= (or the first).
  // Fade the swipe hint in FIRST (over the loading screen) when there are scenes;
  // otherwise show the normal Loading indicator.
  var _hintShown = (TOUR.scenes && TOUR.scenes.length) ? showSwipeHint() : false;
  if(!_hintShown) showLoading(true);
  var chain=Promise.resolve();
  (TOUR.scenes||[]).forEach(function(cfg){ chain=chain.then(function(){return buildScene(cfg);}); });
  chain.then(function(){
    showLoading(false);
    if(!scenes.length){
      hideSwipeHint();
      msgEl.hidden=false;
      if(!TOUR.scenes || !TOUR.scenes.length){   // placeholder project — no panoramas added yet
        document.getElementById('msgTitle').textContent='Coming soon';
        document.getElementById('msgText').textContent='Panoramas for this project will be added soon.';
      } else {                                    // panoramas listed but failed to load
        document.getElementById('msgTitle').textContent='Panoramas not found';
        document.getElementById('msgText').textContent='Check that the image files listed in config.js exist next to this page.';
      }
      return;
    }
    var params=new URLSearchParams(location.search);
    var startId=params.get('start');
    var idx=0;
    if(startId){ for(var i=0;i<scenes.length;i++){ if(scenes[i].id===startId){ idx=i; break; } } }
    function reveal(){ goTo(idx); armSwipeHintTimeout(); }   // goTo() also renders the scene slider
    // When the hint is up, hold the panorama back so the hint is always seen first
    // (>=1.5s after it appears), without piling extra delay onto already-slow loads.
    if(_hintShown){ setTimeout(reveal, Math.max(0, 1500-(Date.now()-_hintShownAt))); }
    else { reveal(); }
  });
  } // init()
})();
</script>
</body>
</html>
