<style>
  :root{
    --ink:#191919; --paper:#ffffff;
    --line:rgba(25,25,25,.14); --line-strong:rgba(25,25,25,.30);
    --muted:rgba(25,25,25,.55); --panel:rgba(255,255,255,.90);
    --radius:2px;
    --name-in:1.5s; --name-out:.8s;   /* project name + QR fades; scaled by SLOW from the script */
    --font:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#0d0d0d;font-family:var(--font);color:var(--ink);cursor:default;}
  body.hide-cursor,body.hide-cursor *{cursor:none;}
  #pano{position:absolute;inset:0;background:#0d0d0d;}
  #pano canvas{outline:none;}
  /* Rendered-video scenes sit above the panorama canvas, below the chrome */
  .reel-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0d0d0d;z-index:9;opacity:0;transition:opacity .6s ease;pointer-events:none;}
  .reel-video.show{opacity:1;}
  /* Still images: two layers so one can cross-fade into the other while it slowly zooms */
  .reel-still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0d0d0d;z-index:5;opacity:0;transition:opacity .6s ease;pointer-events:none;will-change:transform,opacity;}
  .reel-still.show{opacity:1;}
  /* Closing card: image over black, then the white logo; the image fades to black while the
     logo stays, then the logo fades out. Opacities of the image/logo are driven by the script. */
  .reel-closing{position:absolute;inset:0;background:#000;z-index:5;opacity:0;pointer-events:none;}
  .reel-closing.show{opacity:1;}
  .closing-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;transform-origin:58% 48%;will-change:transform,opacity;}   /* zoom aims at the model */
  .closing-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(54vw,1650px);height:auto;aspect-ratio:1280/200;color:#fff;opacity:0;display:block;}
  /* Video closer: the clip plays as the last scene of its project (name box + progress bars
     showing). When it ends it cross-fades to white with the centred BLACK logo, while the name box
     and progress bars fade out with it. */
  .closing-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;display:none;}
  .reel-closing.light{background:#fff;}
  .reel-closing.light .closing-img{display:none;}
  .reel-closing.light .closing-vid{display:block;}
  .reel-closing.light .closing-logo{color:#000;width:min(44vw,1350px);}
  body.closing-light .seg{background:rgba(25,25,25,.16);box-shadow:none;}   /* progress bars readable on white */
  body.closing-light .seg .fill{background:#191919;}

  /* Persistent logo chip, top-left */
  .topbar{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;align-items:flex-start;gap:14px;padding:20px 22px;pointer-events:none;}
  .bar-chip{display:inline-flex;align-items:stretch;gap:12px;padding:9px 14px;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--radius);opacity:1;transition:opacity var(--name-in) ease-in-out;}
  body.closing .bar-chip{opacity:0;transition:opacity var(--name-out) ease-in-out;}   /* no logo box on the closing card */
  .logo-link{display:inline-flex;align-items:center;flex:none;pointer-events:auto;}
  .logo-link:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .logo{height:17px;width:auto;color:var(--ink);display:block;align-self:center;}
  .bar-div{width:1px;align-self:stretch;background:var(--line-strong);flex:none;}
  /* Project name: slow fade-in (1.5s, same as the image cross-fade), quicker fade-out (.8s).
     A CSS transition uses the timing of the state it is heading INTO, hence two rules. */
  .proj-current{display:flex;align-items:center;font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);white-space:nowrap;line-height:1.1;opacity:1;transition:opacity var(--name-in) ease-in-out;}
  .proj-current.out{opacity:0;transition:opacity var(--name-out) ease-in-out;}

  /* Fullscreen button, top-right */
  .top-full{margin-left:auto;pointer-events:auto;-webkit-appearance:none;appearance:none;cursor:pointer;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);transition:background .15s ease,border-color .15s ease,transform .05s ease;}
  .top-full:hover{background:#fff;border-color:var(--line-strong);}
  .top-full:active{transform:translateY(1px);}
  .top-full:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .top-full svg{width:18px;height:18px;display:block;}
  .top-full[hidden]{display:none;}   /* hidden while in fullscreen - Esc (or F) exits */

  /* Per-project QR card, bottom-left corner */
  /* Hidden = transparent + visibility:hidden (not display:none), so it can fade both ways.
     visibility flips only after the fade-out finishes, and immediately on fade-in.
     Same timing as the project name: fade-out .8s (must finish before the swap), fade-in 1.5s. */
  .qrcard{position:absolute;left:22px;bottom:22px;z-index:35;width:168px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.12);opacity:0;visibility:hidden;transition:opacity var(--name-out) ease-in-out,visibility 0s linear var(--name-out);}
  .qrcard.show{opacity:1;visibility:visible;transition:opacity var(--name-in) ease-in-out,visibility 0s;}
  .qrcard img{width:100%;height:auto;display:block;}
  .qr-label{margin-top:8px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.2;}

  /* Loop progress segments, bottom-center */
  .segs{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;display:flex;gap:7px;opacity:1;transition:opacity var(--name-in) ease-in-out;}
  body.closing-logo .segs, body.closing-logo .bar-chip{opacity:0;transition:opacity var(--fade) ease-in-out;}   /* fade out with the closing clip */
  .seg-hit{-webkit-appearance:none;appearance:none;background:none;border:0;margin:0;padding:12px 0;cursor:pointer;display:block;}
  .seg-hit:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  .seg{display:block;width:26px;height:3px;border-radius:2px;background:rgba(255,255,255,.32);box-shadow:0 1px 3px rgba(0,0,0,.25);overflow:hidden;transition:background .15s ease,transform .15s ease;}
  .seg-hit:hover .seg{background:rgba(255,255,255,.62);transform:scaleY(1.6);}
  .seg .fill{display:block;height:100%;width:0;background:#fff;}

  /* Boot / loading splash */
  .splash{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--paper);color:var(--ink);text-align:center;padding:32px;transition:opacity .8s ease;}
  .splash[hidden]{display:none;}
  .splash.fade{opacity:0;}
  .splash .logo-lg{height:30px;width:auto;color:var(--ink);}
  .splash .dots{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
  .splash h1{margin:0;font-size:16px;font-weight:600;}
  .splash p{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted);max-width:340px;}

  /* Paused badge */
  .paused{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:35;padding:10px 20px;background:rgba(25,25,25,.72);color:#fff;border-radius:var(--radius);font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:0;transition:opacity .2s ease;pointer-events:none;}
  .paused.show{opacity:1;}
</style>
</head>

<script>
(function(){
  "use strict";
  var DEG=Math.PI/180;
  function deg(d){return d*DEG;}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function lerp(a,b,t){return a+(b-a)*t;}
  function easeInOut(t){return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;}   // easeInOutCubic

  // ---- Timing (overridable via URL: ?pan=9000&fade=1200&hold=600&zoom=8) ----
  var P=new URLSearchParams(location.search);
  function numParam(name,def){ var v=parseFloat(P.get(name)); return isFinite(v)&&v>=0 ? v : def; }
  // Global pace. The reel runs in the background at events, so everything is SLOW x slower:
  // scene lengths, cross-fades, name/QR fades and the frame-by-frame animation. Motion ranges
  // (pan arc, zoom amount) stay the same, so every movement is SLOW x slower too.
  // Rendered flythrough videos keep their own speed. ?slow=1 restores the original pace.
  var SLOW    = numParam('slow', 2) || 1;
  var PAN_MS  = numParam('pan', 18000)*SLOW;   // pan duration per scene
  var HOLD_MS = numParam('hold', 0)*SLOW;      // still hold at the end of each pan (0 = flow straight into the fade)
  var FADE_MS = numParam('fade', 1500)*SLOW;   // cross-fade between scenes
  var ZOOM    = numParam('zoom', 8);      // gentle push-in over the pan, in degrees of FOV

  // Motion per scene:
  //   'pan'  = slow yaw sweep across the arc + gentle push-in (default)
  //   'zoom' = hold the centered front view and slowly push in (no left-right rotation)
  // Key by tour id (matches the <id>.js filename), tour title, or an individual scene id.
  // Add more lines here to make other projects zoom-only, e.g. 'omval':'zoom'.
  var MOTION = {
    'margriettoren': 'zoom'
  };
  // Optional speed cap for panorama pans, in degrees per second. The scene keeps its length
  // (PAN_MS) but sweeps a narrower arc centred on the front view, so it turns more slowly.
  // At PAN_MS 18s, uncapped: CCH turns ~4.6-6 deg/s, Zeist ~7-10 deg/s (its arcs are wide).
  // Key by tour id, tour title, or scene id.
  var PAN_SPEED = {
    'zeist': 5
  };
  var ZWIDE   = numParam('zwide', 82);    // zoom-mode: starting (wide) FOV, degrees
  var ZOOMIN  = numParam('zoomin', 36);   // zoom-mode: how far to push in, degrees of FOV

  // Scenes that play a rendered VIDEO instead of the live panorama — same chip, title and QR.
  // Key by tour id (the <id>.js name), tour title, or a scene id -> video file, relative to this page.
  // The video's own length drives how long the scene shows. The panorama is still built as a
  // fallback: if the file is missing or can't autoplay, that scene silently pans instead.
  var VIDEO = {
    'margriettoren': 'video/margriettoren.mp4?v=03'
  };
  var MUTE = (P.get('mute')!=='0');       // muted by default so it always autoplays; ?mute=0 for sound
  var ZIMG = numParam('zimg', 1.18);      // still images: zoom between 1.0 and this scale
  var STILL_MS = numParam('still', 12000)*SLOW;   // still images stay this long (panoramas use PAN_MS)

  var DEF = { fovMin:30, fovMax:100, yawLimited:false, yawRange:180, pitchLimited:false, pitchUp:60, pitchDown:60 };

  var panoEl=document.getElementById('pano'),
      stillA=document.getElementById('stillA'), stillB=document.getElementById('stillB'),
      closingEl=document.getElementById('closing'), closingImg=document.getElementById('closingImg'),
      closingLogo=document.getElementById('closingLogo'), closingVid=document.getElementById('closingVid'),
      splashEl=document.getElementById('splash'), splashDots=document.getElementById('splashDots'),
      projectNameEl=document.getElementById('projectName'), fsBtn=document.getElementById('fsBtn'),
      qrcardEl=document.getElementById('qrcard'), qrImg=document.getElementById('qrImg'),
      segsEl=document.getElementById('segs'),
      pausedBadge=document.getElementById('pausedBadge');

  // -------- Load every tour config, in tours.js order, into one playlist --------
  function loadScript(src){
    return new Promise(function(res,rej){
      var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej;
      document.head.appendChild(s);
    });
  }

  loadScript('tours.js').catch(function(){})
    .then(function(){ return loadScript('showreel-projects.js').catch(function(){}); })
    .then(function(){
    var tours = (window.TOURS && window.TOURS.length) ? window.TOURS : [{id:'', name:''}];
    var projects=[];                   // [{id,name,qr,scenes:[...]}]
    var chain=Promise.resolve();
    // 1) Panorama tours (tours.js + each <id>.js). These keep their QR codes.
    tours.forEach(function(t){
      chain=chain.then(function(){
        window.TOUR=null;
        var file = t.id ? t.id+'.js' : 'config.js';
        return loadScript(file).then(function(){
          var d=window.TOUR;
          if(!(d && d.scenes && d.scenes.length)) return;
          var title=(d.title||t.name||t.id);
          var tourDef=Object.assign({}, DEF, d.settings||{});
          var scenes=d.scenes.map(function(sc){
            var motion = sc.motion || d.motion || MOTION[t.id] || MOTION[title] || MOTION[sc.id] || 'pan';
            var video  = sc.video || VIDEO[t.id] || VIDEO[title] || VIDEO[sc.id] || null;
            var panSpeed = sc.panSpeed || d.panSpeed || PAN_SPEED[t.id] || PAN_SPEED[title] || PAN_SPEED[sc.id] || 0;
            return { kind:(video?'video':'pano'), file:(video||sc.file), cfg:sc, motion:motion, panSpeed:panSpeed,
                     settings:Object.assign({}, tourDef, sc.settings||{}) };
          });
          projects.push({ id:t.id, name:title, qr:(t.id?'qr/'+t.id+'.png':null), scenes:scenes });
        }).catch(function(){ /* missing/broken tour file - skip it */ });
      });
    });
    return chain.then(function(){
      // 2) Still/video projects from showreel-projects.js. These have no QR code - unless the
      //    entry shares its id with a panorama tour. Then it keeps the tour's name and QR, and:
      //     - if it lists { type:"pano", scene:"<scene id>" } entries, or sets sequence:true, it
      //       is the tour's COMPLETE sequence for the showreel (tour scenes not listed are left
      //       out of the reel only; the QR tour itself is unchanged);
      //     - otherwise its scenes are APPENDED after the tour's own scenes.
      function mapScene(sc){
        return { kind:(sc.type==='video'?'video':'image'), file:sc.file,
                 focus:sc.focus, zoom:sc.zoom, scale:sc.scale, stepped:!!sc.stepped };
      }
      (window.SHOWREEL_PROJECTS||[]).forEach(function(p){
        if(!p || !p.scenes || !p.scenes.length) return;
        var existing=projects.filter(function(q){ return q.id===p.id; })[0];
        if(existing){
          if(p.name) existing.name=p.name;            // showreel name wins over the tour title
          var isSequence=!!p.sequence || p.scenes.some(function(sc){ return sc.type==='pano'; });
          if(isSequence){
            var own=existing.scenes;
            existing.scenes=p.scenes.map(function(sc){
              if(sc.type!=='pano') return mapScene(sc);
              return own.filter(function(x){ return x.cfg && x.cfg.id===sc.scene; })[0] || null;
            }).filter(Boolean);
          } else {
            existing.scenes=existing.scenes.concat(p.scenes.map(mapScene));
          }
          return;
        }
        projects.push({ id:p.id, name:(p.name||p.id), qr:p.qr||null, scenes:p.scenes.map(mapScene) });
      });
      // 3) Play order from SHOWREEL_ORDER; anything unlisted keeps its place at the end.
      var byId={}; projects.forEach(function(p){ byId[p.id]=p; });
      var out=[], seen={};
      (window.SHOWREEL_ORDER||[]).forEach(function(id){
        if(byId[id] && !seen[id]){ seen[id]=1; out.push(byId[id]); }
      });
      projects.forEach(function(p){ if(!seen[p.id]) out.push(p); });
      return out;
    });
  }).then(start);

  // ---------------------------- Build & play ----------------------------
  function start(projects){
    if(!projects.length){ splashDots.textContent='No projects found.'; return; }

    var viewer=new Marzipano.Viewer(panoEl,{controls:{mouseViewMode:'drag'}});
    try{ viewer.controls().disable(); }catch(e){}   // showreel is non-interactive

    projects.forEach(function(p){ if(p.qr){ var q=new Image(); q.src=p.qr; } });   // warm QR cache

    // The video closer belongs to a project (SHOWREEL_CLOSING.project): that project always plays
    // last, right before the clip, so its name box carries straight on into the closer.
    var CL=window.SHOWREEL_CLOSING;
    if(CL && CL.video && CL.project){
      for(var k=0;k<projects.length;k++){
        if(projects[k].id===CL.project){ projects.push(projects.splice(k,1)[0]); break; }
      }
    }

    // Flatten projects -> a single ordered list of scenes.
    var items=[];
    projects.forEach(function(p){
      p.scenes.forEach(function(sc){
        items.push({ projectId:p.id, projectName:p.name, qr:p.qr, kind:sc.kind, file:sc.file,
                     cfg:sc.cfg, motion:sc.motion, settings:sc.settings, panSpeed:sc.panSpeed,
                     focus:sc.focus, zoom:sc.zoom, scale:sc.scale, stepped:sc.stepped });
      });
    });
    // Closing card with the logo - always the final scene before the loop starts again.
    var C=window.SHOWREEL_CLOSING;
    if(C && C.video){
      var cp=C.project ? projects.filter(function(p){ return p.id===C.project; })[0] : null;
      items.push({ projectId:(cp?cp.id:'closing'), projectName:(cp?cp.name:''), qr:(cp?cp.qr:null),
                   kind:'closing', file:C.video, video:true,
                   logoSlides:(C.logoSlides!=null?C.logoSlides:0.9) });
      closingVid.muted=true; closingVid.defaultMuted=true; closingVid.playsInline=true;
      closingVid.src=C.video; try{ closingVid.load(); }catch(e){}   // preload, like the other clips
    } else if(C && C.image){
      items.push({ projectId:'closing', projectName:'', qr:null, kind:'closing', file:C.image });
      var pc=new Image(); pc.src=C.image;
    }

    function yawArcLimiter(centerRad, halfRad){
      return function(p){
        var d=Math.atan2(Math.sin(p.yaw-centerRad), Math.cos(p.yaw-centerRad));
        if(d>halfRad) d=halfRad; else if(d<-halfRad) d=-halfRad;
        var y=centerRad+d; p.yaw=Math.atan2(Math.sin(y), Math.cos(y)); return p;
      };
    }
    function makeLimiter(S, yawCenterRad){
      var L=Marzipano.RectilinearView.limit;
      var parts=[ L.vfov(deg(S.fovMin),deg(S.fovMax)), L.hfov(deg(1),deg(150)) ];
      if(S.yawLimited){ parts.push(yawArcLimiter(yawCenterRad, deg(S.yawRange)/2)); }
      else parts.push(L.pitch(-Math.PI/2,Math.PI/2));
      if(S.pitchLimited) parts.push(L.pitch(-deg(S.pitchUp),deg(S.pitchDown)));
      else if(S.yawLimited) parts.push(L.pitch(-Math.PI/2,Math.PI/2));
      return Marzipano.util.compose.apply(null,parts);
    }

    // Every video scene gets its OWN <video>, created here and told to preload, so the
    // clip is buffered long before its turn. Sharing one element meant each clip only
    // started downloading when its scene began - which showed as a black screen - and the
    // two clips kept overwriting each other on every loop.
    function makeVideoEl(it){
      var v=document.createElement('video');
      v.className='reel-video';
      v.muted=MUTE; v.defaultMuted=true; v.playsInline=true;
      v.setAttribute('playsinline',''); v.setAttribute('muted','');
      v.preload='auto'; v.src=it.file;
      document.body.insertBefore(v, stillA);
      try{ v.load(); }catch(e){}
      it.videoEl=v;
    }

    // Build a Marzipano scene for panorama scenes (and for video scenes that have a
    // panorama fallback). Plain image/video projects need nothing here.
    function buildItem(it, idx){
      if(it.kind==='video') makeVideoEl(it);
      if(it.kind==='image' || it.kind==='closing' || !it.cfg) return Promise.resolve(true);
      return new Promise(function(resolve){
        var img=new Image();
        img.onload=function(){
          var w=img.naturalWidth||4096;
          var S=it.settings;
          var frontYaw=deg((it.cfg.front&&it.cfg.front.yaw)||0);
          var frontPitch=deg((it.cfg.front&&it.cfg.front.pitch)||0);
          var geometry=new Marzipano.EquirectGeometry([{width:w}]);
          var source=Marzipano.ImageUrlSource.fromString(it.cfg.file);
          var view=new Marzipano.RectilinearView({yaw:frontYaw,pitch:frontPitch,fov:deg(60)}, makeLimiter(S,frontYaw));
          var marzScene=viewer.createScene({source:source,geometry:geometry,view:view,pinFirstLevel:true});

          it.view=view; it.marzScene=marzScene; it.frontPitch=frontPitch;
          if(it.motion==='zoom'){
            // Hold the centered front view; slowly push in from wide to close (no rotation).
            var zStart=clamp(ZWIDE, S.fovMin, S.fovMax);
            var zEnd  =clamp(zStart-ZOOMIN, S.fovMin, S.fovMax);
            it.panFrom=frontYaw; it.panTo=frontYaw;
            it.fovFrom=deg(zStart); it.fovTo=deg(zEnd);
          } else {
            // Slow yaw sweep across (an inset of) the allowed arc, alternating direction,
            // with a gentle push-in.
            var half = S.yawLimited ? deg(S.yawRange)/2*0.92 : deg(55);
            // speed cap (deg/s at normal pace; divided by SLOW so the arc stays the same and only the speed drops)
            if(it.panSpeed){ half=Math.min(half, deg(it.panSpeed/SLOW*PAN_MS/1000)/2); }
            var dir  = (idx%2===0)?1:-1;
            var fovStart = clamp(70, S.fovMin, S.fovMax);
            var fovEnd   = clamp(fovStart-ZOOM, S.fovMin, S.fovMax);   // gentle push-in
            it.panFrom=frontYaw-dir*half; it.panTo=frontYaw+dir*half;
            it.fovFrom=deg(fovStart); it.fovTo=deg(fovEnd);
          }
          resolve(true);
        };
        img.onerror=function(){ resolve(false); };
        img.src=it.cfg.file;
      });
    }

    // Preload/build all scenes sequentially, then run the reel.
    var built=[];
    var chain=Promise.resolve();
    items.forEach(function(it,i){
      chain=chain.then(function(){
        splashDots.textContent='Loading… '+(i+1)+' / '+items.length;
        return buildItem(it,i).then(function(ok){ if(ok) built.push(it); });
      });
    });
    chain.then(function(){
      if(!built.length){ splashDots.textContent='Nothing could be loaded.'; return; }
      items=built;
      buildSegments(items.length);
      // Start fetching the opening scene during the splash so it appears without a gap.
      var first=items[0];
      if(first && first.kind==='image'){ var pre=new Image(); pre.src=first.file; }
      // Fade splash out, begin the loop.
      splashEl.classList.add('fade');
      setTimeout(function(){ splashEl.hidden=true; }, 800);
      run(items);
      requestWakeLock();
    });
  }

  // ------------------------------- Segments -------------------------------
  var segFills=[];
  var jumpTo=null;   // set by run(): jump straight to scene i
  function buildSegments(n){
    segsEl.innerHTML=''; segFills=[];
    for(var i=0;i<n;i++){
      var hit=document.createElement('button'); hit.type='button'; hit.className='seg-hit';
      hit.setAttribute('aria-label','Show image '+(i+1)); hit.title='Image '+(i+1);
      var seg=document.createElement('span'); seg.className='seg';
      var f=document.createElement('span'); f.className='fill';
      seg.appendChild(f); hit.appendChild(seg); segsEl.appendChild(hit); segFills.push(f);
      hit.addEventListener('click', (function(idx){ return function(){ if(jumpTo) jumpTo(idx); }; })(i));
    }
  }
  function setSegFills(current){
    for(var i=0;i<segFills.length;i++){ segFills[i].style.width = (i<current?'100%':'0%'); }
  }

  // ----------------------- Project name + QR (top left) -----------------------
  // Missing QR file → hide the card rather than show a broken image.
  qrImg.addEventListener('error', function(){ qrcardEl.classList.remove('show'); });
  var lastTitle=null;
  // Name and QR card fade out together, swap while invisible, then fade back in together.
  // A project without a QR simply leaves the card faded out.
  var NAME_IN_MS=1500*SLOW, NAME_OUT_MS=800*SLOW;
  document.documentElement.style.setProperty('--name-in',  NAME_IN_MS+'ms');
  document.documentElement.style.setProperty('--name-out', NAME_OUT_MS+'ms');
  document.documentElement.style.setProperty('--fade', FADE_MS+'ms');
  var SWAP_MS=NAME_OUT_MS;           // swap once the fade-out has finished
  function setProjectName(title, qrSrc){
    if(title===lastTitle) return;   // scenes within one project keep the name/QR steady (no flicker)
    lastTitle=title;
    projectNameEl.classList.add('out');
    qrcardEl.classList.remove('show');
    setTimeout(function(){
      if(lastTitle!==title) return;  // superseded by a quicker project change
      projectNameEl.textContent=title; projectNameEl.classList.remove('out');
      if(!qrSrc) return;
      function showCard(){ if(lastTitle===title) qrcardEl.classList.add('show'); }
      if(qrImg.getAttribute('src')===qrSrc && qrImg.complete){ showCard(); return; }
      qrImg.onload=function(){ qrImg.onload=null; showCard(); };   // never fade in an empty card
      qrImg.setAttribute('src', qrSrc);
    }, SWAP_MS);
  }

  // ------------------------------- Playback -------------------------------
  // Three kinds of scene share one timeline:
  //   'pano'  - a Marzipano panorama, panned or zoomed by moving the camera
  //   'image' - a still photo/render, shown full-bleed with a slow zoom
  //   'video' - a rendered clip, which runs for its own length
  // Panoramas are drawn on the canvas underneath; images and video are overlays
  // stacked above it (stills z5/z6, video z9).
  function run(list){
    var N=list.length, current=-1;
    var start=0, lastNow=0, paused=false, token=0;
    var stills=[stillA, stillB], front=0;
    var videos=list.filter(function(x){ return x.videoEl; }).map(function(x){ return x.videoEl; });
    var overlays=stills.concat(videos).concat([closingEl]);   // everything that sits above the panorama
    overlays.forEach(function(el){ el.style.transition='opacity '+FADE_MS+'ms ease'; });
    function pauseAllVideos(){ videos.concat([closingVid]).forEach(function(v){ try{ v.pause(); }catch(e){} }); }

    function next(){ playScene((current+1)%N); }
    function overlayVisible(){
      return overlays.some(function(el){ return el.classList.contains('show'); });
    }
    // Hide every overlay except `keep`. Called once the incoming visual is fully opaque,
    // so the outgoing one never uncovers whatever sits beneath it.
    function hideOverlays(keep){
      overlays.forEach(function(el){
        if(el!==keep){ el.classList.remove('show'); if(el.tagName==='VIDEO'){ try{ el.pause(); }catch(e){} }
                       if(el===closingEl){ try{ closingVid.pause(); }catch(e){} } }
      });
    }
    function presentOverlay(el, z, myToken){
      // The incoming layer always goes ON TOP of whatever is showing, whatever its type, so it
      // cross-fades over the outgoing one. (Fixed stacking put videos above stills, so after a
      // video an image faded in underneath it and the video's last frame lingered on top.)
      // Layers stay between 5 and 11 - below the chrome (name bar, QR, progress bars).
      overlays.forEach(function(o){
        if(o!==el) o.style.zIndex = o.classList.contains('show') ? 10 : 5;
      });
      el.style.zIndex=11; el.classList.add('show');
      setTimeout(function(){ if(myToken===token) hideOverlays(el); }, FADE_MS);
    }
    // The name/QR must not run ahead of the picture. Scenes reveal at different moments
    // (a video waits until it has a frame), so this is called at the reveal itself: the old
    // name fades out alongside the outgoing picture, and the new one fades in (after the
    // .8s swap) while the new picture fades up.
    function announce(it, myToken){
      if(myToken===token) setProjectName(it.projectName, it.qr);
    }

    function showPano(it, duration){
      it.view.setYaw(it.panFrom); it.view.setPitch(it.frontPitch); it.view.setFov(it.fovFrom);
      it.marzScene.switchTo({transitionDuration:duration});
    }

    // Shared clock: runs for durMs (+HOLD_MS), ticks onTick(t) with t going 0->1 at a
    // constant rate, keeps the progress bar in step, honours pause, then advances.
    // Panoramas use PAN_MS; stills use the shorter STILL_MS; videos run their own length.
    function timedLoop(i, myToken, durMs, onTick){
      start=0; lastNow=0;
      requestAnimationFrame(function loop(now){
        if(myToken!==token) return;                 // superseded by a skip/next
        if(!start){ start=now; lastNow=now; }
        if(paused){ start+=now-lastNow; lastNow=now; requestAnimationFrame(loop); return; }
        lastNow=now;
        var ms=now-start, t=clamp(ms/durMs,0,1);
        onTick(t);
        if(segFills[i]) segFills[i].style.width = clamp(ms/(durMs+HOLD_MS),0,1)*100+'%';
        if(ms < durMs+HOLD_MS){ requestAnimationFrame(loop); }
        else { next(); }
      });
    }

    // --- panorama: constant-speed pan or zoom of the camera ---
    function playPanoScene(i, it, myToken){
      timedLoop(i, myToken, PAN_MS, function(t){
        it.view.setYaw(lerp(it.panFrom,it.panTo,t));
        it.view.setPitch(it.frontPitch);
        it.view.setFov(lerp(it.fovFrom,it.fovTo,t));
      });
    }

    // --- still image: full-bleed, slowly zooming in or out (alternating) ---
    function playImageScene(i, it, myToken){
      front=1-front;
      var el=stills[front], other=stills[1-front];
      other.style.zIndex=5;
      el.onerror=function(){ if(myToken===token) next(); };       // missing file -> move on
      if(el.getAttribute('src')!==it.file){ el.setAttribute('src', it.file); }
      // Direction alternates by position unless the image sets zoom:'in'|'out'.
      var zFrom, zTo;
      if(it.scale && it.scale.length===2){ zFrom=+it.scale[0]; zTo=+it.scale[1]; }   // explicit range
      else { var zoomIn = it.zoom ? (it.zoom==='in') : (i%2===0); zFrom=zoomIn?1:ZIMG; zTo=zoomIn?ZIMG:1; }
      // `focus` is the point of interest, e.g. '50% 75%' for a building in the lower part
      // of a sky-heavy render: the zoom heads towards it, and the cover-crop favours it.
      // Always set (layers are reused), falling back to the centre.
      var focus = it.focus || '50% 50%';
      el.style.transformOrigin = focus;
      el.style.objectPosition  = focus;
      el.style.transform='scale('+zFrom+')';
      presentOverlay(el, 6, myToken);
      announce(it, myToken);
      timedLoop(i, myToken, STILL_MS, function(t){ el.style.transform='scale('+lerp(zFrom,zTo,t)+')'; });
    }

    // --- rendered video: the clip's own length decides how long it stays up ---
    function playVideoScene(i, it, myToken){
      var v=it.videoEl;
      if(!v){ next(); return; }
      var done=false, alive=true;
      function go(){ if(!done && myToken===token){ done=true; next(); } }
      function fallback(){                       // can't play -> panorama if there is one, else skip
        if(myToken!==token || done) return;
        alive=false;
        if(it.marzScene){ showPano(it, FADE_MS); hideOverlays(null); announce(it, myToken); playPanoScene(i, it, myToken); }
        else { done=true; next(); }
      }
      v.onended=go; v.onerror=fallback;
      v.muted=MUTE;
      // A stepped (frame-by-frame) animation slows down with the rest of the reel; holding each
      // frame longer loses nothing. Rendered flythroughs keep their own speed.
      v.defaultPlaybackRate = v.playbackRate = (it.stepped ? 1/SLOW : 1);
      try{ v.currentTime=0; }catch(e){}
      var pp=v.play();
      // Only real failures fall back; an AbortError (play interrupted by a seek/skip) is harmless -
      // the loop below simply retries play().
      if(pp&&pp.catch) pp.catch(function(e){ if(!e || e.name!=='AbortError') fallback(); });
      // Only fade the clip in once it actually has a frame on screen, so we never cross-fade
      // onto black while it buffers; the previous scene stays up until then.
      // NOTE: rewinding to 0 above starts a seek, which briefly drops readyState - and
      // 'loadeddata' has already fired during preload and will not fire again. So wait on
      // events that DO repeat: a presented frame (requestVideoFrameCallback) or 'playing'.
      var revealed=false;
      function reveal(){
        if(revealed || myToken!==token) return;
        revealed=true; presentOverlay(v, 9, myToken); announce(it, myToken);
      }
      if(v.readyState>=2 && !v.seeking){ reveal(); }
      else if(typeof v.requestVideoFrameCallback==='function'){
        v.requestVideoFrameCallback(function(){ reveal(); });
        setTimeout(reveal, 3000);                                  // safety net
      } else {
        ['playing','seeked','canplay'].forEach(function(ev){
          v.addEventListener(ev, function once(){ v.removeEventListener(ev, once); reveal(); });
        });
        setTimeout(reveal, 3000);                                  // safety net
      }
      requestAnimationFrame(function loop(){
        if(myToken!==token || !alive) return;
        if(paused){ if(!v.paused) v.pause(); requestAnimationFrame(loop); return; }
        if(v.paused && !done){ var r=v.play(); if(r&&r.catch) r.catch(function(){}); }
        var d=v.duration||0, c=v.currentTime||0;
        if(segFills[i]) segFills[i].style.width = (d?clamp(c/d,0,1):0)*100+'%';
        requestAnimationFrame(loop);
      });
    }

    // --- closing card: image fades in, logo fades in, image fades to black (logo stays),
    //     logo fades out, then the loop starts again from black. All timings follow SLOW.
    function smooth(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
    function playClosingScene(i, it, myToken){
      closingEl.classList.remove('light'); document.body.classList.remove('closing-light');
      closingLogo.style.top='';
      if(closingImg.getAttribute('src')!==it.file) closingImg.setAttribute('src', it.file);
      closingImg.style.opacity='1'; closingLogo.style.opacity='0'; closingImg.style.transform='scale(1)';
      document.body.classList.add('closing');            // hide the logo box top-left
      presentOverlay(closingEl, 11, myToken);            // image fades in over the last scene
      announce(it, myToken);                             // (no name, no QR)
      var LOGO_FADE=1500*SLOW;
      var logoIn  = FADE_MS + 1000*SLOW;                 // logo starts once the image is in
      var imgOut  = logoIn + LOGO_FADE + 1500*SLOW;      // image + logo together, briefly
      var logoOut = imgOut + FADE_MS + 4000*SLOW;        // white logo alone on black, longer
      var end     = logoOut + LOGO_FADE + 500*SLOW;      // a short beat of black
      var CLOSE_ZOOM = 1.08;                             // image only (not the logo): slow constant zoom-in
      var imgGone = imgOut + FADE_MS;                    // ...for as long as the image is on screen
      timedLoop(i, myToken, end, function(t){
        var ms=t*end;
        closingImg.style.opacity  = String(1 - smooth((ms-imgOut)/FADE_MS));
        closingImg.style.transform = 'scale('+(1+(CLOSE_ZOOM-1)*clamp(ms/imgGone,0,1))+')';
        closingLogo.style.opacity = String(smooth((ms-logoIn)/LOGO_FADE) * (1 - smooth((ms-logoOut)/LOGO_FADE)));
      });
    }

    // --- video closer: the clip plays as the last scene of its project, at its own speed, with the
    //     name box and progress bars showing. When it ends it cross-fades (FADE_MS) to white with
    //     the centred black logo - the name box and bars fade out with it - and the logo stays for
    //     ~`logoSlides` x one still's duration before the first project fades in over it.
    function playClosingVideo(i, it, myToken){
      var v=closingVid, bc=document.body.classList;
      closingEl.classList.add('light');
      bc.remove('closing','closing-logo'); bc.add('closing-light');     // dark progress bars on the white clip
      v.style.opacity='1'; closingLogo.style.opacity='0'; closingLogo.style.top='';
      var logoMs=Math.max(STILL_MS*it.logoSlides, FADE_MS*2);
      var revealed=false, ended=false, tailMs=0, last=0;
      function reveal(){
        if(revealed || myToken!==token) return;
        revealed=true; presentOverlay(closingEl, 11, myToken); announce(it, myToken);
      }
      function finish(){
        if(ended || myToken!==token) return;
        ended=true; bc.add('closing-logo');                          // name box + bars fade out now
        if(segFills[i]) segFills[i].style.width='100%';
      }
      function fail(){ reveal(); finish(); }                         // no clip -> straight to the logo
      v.onended=finish;
      v.onerror=function(){ if(myToken===token) fail(); };
      try{ v.currentTime=0; }catch(e){}
      var pp=v.play(); if(pp&&pp.catch) pp.catch(function(e){ if(myToken===token && (!e || e.name!=='AbortError')) fail(); });
      if(v.readyState>=2 && !v.seeking) reveal();
      else if(typeof v.requestVideoFrameCallback==='function') v.requestVideoFrameCallback(function(){ reveal(); });
      else v.addEventListener('playing', function once(){ v.removeEventListener('playing', once); reveal(); });
      setTimeout(reveal, 3000);                                      // safety net
      requestAnimationFrame(function loop(now){
        if(myToken!==token) return;                                  // skipped / superseded
        var dt=last ? now-last : 0; last=now;
        if(!ended){
          if(paused){ if(!v.paused) v.pause(); requestAnimationFrame(loop); return; }
          if(v.paused && revealed){ var r=v.play(); if(r&&r.catch) r.catch(function(){}); }
          var d=(v.duration && isFinite(v.duration)) ? v.duration : 0;
          if(segFills[i] && d) segFills[i].style.width=clamp((v.currentTime||0)/d,0,1)*100+'%';
          requestAnimationFrame(loop); return;
        }
        if(!paused) tailMs+=dt;
        var x=smooth(tailMs/FADE_MS);
        v.style.opacity=String(1-x); closingLogo.style.opacity=String(x);   // clip -> logo on white
        if(tailMs<logoMs) requestAnimationFrame(loop); else next();          // next scene fades in over the logo
      });
    }

    // Warm the next scene so it is ready the moment it is needed.
    function preloadNext(i){
      var nx=list[(i+1)%N];
      if(nx && nx.kind==='image'){ var im=new Image(); im.src=nx.file; }
    }

    function playScene(i){
      current=i; token++; var myToken=token;
      var it=list[i];
      setSegFills(i);
      preloadNext(i);
      if(it.kind==='closing'){ (it.video ? playClosingVideo : playClosingScene)(i, it, myToken); return; }
      // Leaving the closing card: bring the logo box back as the new name fades in.
      var bc=document.body.classList;
      if(bc.contains('closing') || bc.contains('closing-light') || bc.contains('closing-logo')){
        setTimeout(function(){ if(myToken===token) bc.remove('closing','closing-light','closing-logo'); }, SWAP_MS);
      }
      if(it.kind==='video'){ playVideoScene(i, it, myToken); return; }
      if(it.kind==='image'){ playImageScene(i, it, myToken); return; }
      // Panorama: if an overlay is covering the screen, put the panorama in place instantly
      // behind it and let the overlay fade away over it, so nothing flashes through.
      var instant = overlayVisible();
      showPano(it, instant ? 0 : FADE_MS);
      hideOverlays(null);
      announce(it, myToken);
      playPanoScene(i, it, myToken);
    }

    jumpTo=function(i){ paused=false; pausedBadge.classList.remove('show'); playScene(i); };

    // Controls (optional - handy for testing / manual kiosks)
    document.addEventListener('keydown',function(ev){
      if(ev.key===' '){ ev.preventDefault(); paused=!paused; pausedBadge.classList.toggle('show',paused);
                        if(paused){ pauseAllVideos(); } }
      else if(ev.key==='ArrowRight'){ jumpTo((current+1)%N); }
      else if(ev.key==='ArrowLeft'){ jumpTo((current-1+N)%N); }
      else if(ev.key==='f'||ev.key==='F'){ toggleFullscreen(); }
    });

    playScene(0);
  }

  // ------------------------------- Kiosk niceties -------------------------------
  var ENTER_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
  var EXIT_ICON ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
  // In fullscreen the button isn't needed, so it hides; Esc (or the F key) exits.
  // F11 / kiosk-mode fullscreen doesn't set document.fullscreenElement, so also treat a
  // window that fills the whole screen as fullscreen.
  function isFullscreen(){
    if(document.fullscreenElement) return true;
    return Math.abs(window.innerWidth-screen.width)<=1 && Math.abs(window.innerHeight-screen.height)<=1;
  }
  function updateFsIcon(){
    var fs=isFullscreen();
    fsBtn.innerHTML = fs ? EXIT_ICON : ENTER_ICON;
    fsBtn.hidden = fs;
  }
  updateFsIcon();
  window.addEventListener('resize', updateFsIcon);
  function toggleFullscreen(){
    try{
      var el=document.documentElement, p;
      if(!document.fullscreenElement){ if(el.requestFullscreen) p=el.requestFullscreen(); }
      else{ if(document.exitFullscreen) p=document.exitFullscreen(); }
      if(p && p.catch) p.catch(function(){});   // ignore blocked/no-gesture rejections
    }catch(e){}
  }
  fsBtn.addEventListener('click', toggleFullscreen);   // only this button toggles; Esc also exits
  document.addEventListener('fullscreenchange', updateFsIcon);

  // Hide the mouse cursor after a few idle seconds (kiosk look); reveal on move.
  var cursorTimer=null;
  function armCursorHide(){
    document.body.classList.remove('hide-cursor');
    clearTimeout(cursorTimer);
    cursorTimer=setTimeout(function(){ document.body.classList.add('hide-cursor'); }, 3000);
  }
  document.addEventListener('mousemove', armCursorHide);
  armCursorHide();

  // Keep the display awake (kiosk / smart-screen). Re-acquire when tab regains focus.
  var wakeLock=null;
  function requestWakeLock(){
    if(!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function(wl){ wakeLock=wl; }).catch(function(){});
  }
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') requestWakeLock(); });
})();
</script>
</body>
</html>
