<style>
  :root{
    --ink:#191919; --paper:#ffffff;
    --line:rgba(25,25,25,.14); --line-strong:rgba(25,25,25,.30);
    --muted:rgba(25,25,25,.55); --panel:rgba(255,255,255,.90);
    --radius:2px;
    --font:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#0d0d0d;font-family:var(--font);color:var(--ink);cursor:default;}
  body.hide-cursor,body.hide-cursor *{cursor:none;}
  #pano{position:absolute;inset:0;background:#0d0d0d;}
  #pano canvas{outline:none;}

  /* Persistent logo chip, top-left */
  .topbar{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;align-items:flex-start;gap:14px;padding:20px 22px;pointer-events:none;}
  .bar-chip{display:inline-flex;align-items:stretch;gap:12px;padding:9px 14px;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--radius);}
  .logo{height:17px;width:auto;color:var(--ink);display:block;align-self:center;}
  .bar-div{width:1px;align-self:stretch;background:var(--line-strong);flex:none;}
  .proj-current{display:flex;align-items:center;font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);white-space:nowrap;line-height:1.1;transition:opacity .5s ease;}

  /* Fullscreen button, top-right */
  .top-full{margin-left:auto;pointer-events:auto;-webkit-appearance:none;appearance:none;cursor:pointer;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);transition:background .15s ease,border-color .15s ease,transform .05s ease;}
  .top-full:hover{background:#fff;border-color:var(--line-strong);}
  .top-full:active{transform:translateY(1px);}
  .top-full:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .top-full svg{width:18px;height:18px;display:block;}

  /* Per-project QR card, below the logo/name chip (top-left) */
  .qrcard{position:absolute;left:22px;top:70px;z-index:35;width:168px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.12);transition:opacity .5s ease;}
  .qrcard[hidden]{display:none;}
  .qrcard img{width:100%;height:auto;display:block;}
  .qr-label{margin-top:8px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.2;}

  /* Loop progress segments, bottom-center */
  .segs{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:30;display:flex;gap:7px;pointer-events:none;}
  .seg{width:26px;height:3px;border-radius:2px;background:rgba(255,255,255,.32);box-shadow:0 1px 3px rgba(0,0,0,.25);overflow:hidden;}
  .seg .fill{display:block;height:100%;width:0;background:#fff;}

  /* Boot / loading splash */
  .splash{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--paper);color:var(--ink);text-align:center;padding:32px;transition:opacity .8s ease;}
  .splash[hidden]{display:none;}
  .splash.fade{opacity:0;}
  .splash .logo-lg{height:30px;width:auto;color:var(--ink);}
  .splash .dots{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
  .splash h1{margin:0;font-size:16px;font-weight:600;}
  .splash p{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted);max-width:340px;}

  /* Transient hint (fullscreen / controls), fades away */
  .hint{position:absolute;right:22px;bottom:26px;z-index:35;display:flex;gap:8px;align-items:center;padding:8px 13px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:opacity .6s ease;pointer-events:none;}
  .hint[hidden]{display:none;}
  .hint.gone{opacity:0;}

  /* Paused badge */
  .paused{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:35;padding:10px 20px;background:rgba(25,25,25,.72);color:#fff;border-radius:var(--radius);font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:0;transition:opacity .2s ease;pointer-events:none;}
  .paused.show{opacity:1;}
</style>
</head>

<script src="marzipano.js"></script>
<script>
(function(){
  "use strict";
  var DEG=Math.PI/180;
  function deg(d){return d*DEG;}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function lerp(a,b,t){return a+(b-a)*t;}
  function easeInOut(t){return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;}   // easeInOutCubic

  // ---- Timing (overridable via URL: ?pan=9000&fade=1200&hold=600&zoom=8) ----
  var P=new URLSearchParams(location.search);
  function numParam(name,def){ var v=parseFloat(P.get(name)); return isFinite(v)&&v>=0 ? v : def; }
  var PAN_MS  = numParam('pan', 18000);   // pan duration per scene
  var HOLD_MS = numParam('hold', 0);      // still hold at the end of each pan (0 = flow straight into the fade)
  var FADE_MS = numParam('fade', 1500);   // cross-fade between scenes
  var ZOOM    = numParam('zoom', 8);      // gentle push-in over the pan, in degrees of FOV

  // Motion per scene:
  //   'pan'  = slow yaw sweep across the arc + gentle push-in (default)
  //   'zoom' = hold the centered front view and slowly push in (no left-right rotation)
  // Key by tour id (matches the <id>.js filename), tour title, or an individual scene id.
  // Add more lines here to make other projects zoom-only, e.g. 'omval':'zoom'.
  var MOTION = {
    'margriettoren': 'zoom'
  };
  var ZWIDE   = numParam('zwide', 82);    // zoom-mode: starting (wide) FOV, degrees
  var ZOOMIN  = numParam('zoomin', 36);   // zoom-mode: how far to push in, degrees of FOV

  var DEF = { fovMin:30, fovMax:100, yawLimited:false, yawRange:180, pitchLimited:false, pitchUp:60, pitchDown:60 };

  var panoEl=document.getElementById('pano'),
      splashEl=document.getElementById('splash'), splashDots=document.getElementById('splashDots'),
      projectNameEl=document.getElementById('projectName'), fsBtn=document.getElementById('fsBtn'),
      qrcardEl=document.getElementById('qrcard'), qrImg=document.getElementById('qrImg'),
      segsEl=document.getElementById('segs'), hintEl=document.getElementById('hint'),
      pausedBadge=document.getElementById('pausedBadge');

  // -------- Load every tour config, in tours.js order, into one playlist --------
  function loadScript(src){
    return new Promise(function(res,rej){
      var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej;
      document.head.appendChild(s);
    });
  }

  loadScript('tours.js').catch(function(){}).then(function(){
    var tours = (window.TOURS && window.TOURS.length) ? window.TOURS : [{id:'', name:''}];
    var defs=[];                       // [{tourTitle, def}]
    var chain=Promise.resolve();
    tours.forEach(function(t){
      chain=chain.then(function(){
        window.TOUR=null;
        var file = t.id ? t.id+'.js' : 'config.js';
        return loadScript(file).then(function(){
          var d=window.TOUR;
          if(d && d.scenes && d.scenes.length){ defs.push({tourId:t.id, tourTitle:(d.title||t.name||t.id), def:d}); }
        }).catch(function(){ /* missing/broken tour file — skip it */ });
      });
    });
    return chain.then(function(){ return defs; });
  }).then(start);

  // ---------------------------- Build & play ----------------------------
  function start(defs){
    if(!defs.length){ splashDots.textContent='No panoramas found.'; return; }

    var viewer=new Marzipano.Viewer(panoEl,{controls:{mouseViewMode:'drag'}});
    try{ viewer.controls().disable(); }catch(e){}   // showreel is non-interactive

    // Flatten tours -> a single ordered list of scene descriptors.
    var items=[];
    defs.forEach(function(entry){
      var tourDef=Object.assign({}, DEF, entry.def.settings||{});
      entry.def.scenes.forEach(function(sc){
        var motion = sc.motion || entry.def.motion || MOTION[entry.tourId] || MOTION[entry.tourTitle] || MOTION[sc.id] || 'pan';
        items.push({ tourId:entry.tourId, tourTitle:entry.tourTitle, cfg:sc, motion:motion,
                     settings:Object.assign({}, tourDef, sc.settings||{}) });
      });
    });

    function yawArcLimiter(centerRad, halfRad){
      return function(p){
        var d=Math.atan2(Math.sin(p.yaw-centerRad), Math.cos(p.yaw-centerRad));
        if(d>halfRad) d=halfRad; else if(d<-halfRad) d=-halfRad;
        var y=centerRad+d; p.yaw=Math.atan2(Math.sin(y), Math.cos(y)); return p;
      };
    }
    function makeLimiter(S, yawCenterRad){
      var L=Marzipano.RectilinearView.limit;
      var parts=[ L.vfov(deg(S.fovMin),deg(S.fovMax)), L.hfov(deg(1),deg(150)) ];
      if(S.yawLimited){ parts.push(yawArcLimiter(yawCenterRad, deg(S.yawRange)/2)); }
      else parts.push(L.pitch(-Math.PI/2,Math.PI/2));
      if(S.pitchLimited) parts.push(L.pitch(-deg(S.pitchUp),deg(S.pitchDown)));
      else if(S.yawLimited) parts.push(L.pitch(-Math.PI/2,Math.PI/2));
      return Marzipano.util.compose.apply(null,parts);
    }

    // Build one Marzipano scene per item; compute its pan geometry.
    function buildItem(it, idx){
      return new Promise(function(resolve){
        var img=new Image();
        img.onload=function(){
          var w=img.naturalWidth||4096;
          var S=it.settings;
          var frontYaw=deg((it.cfg.front&&it.cfg.front.yaw)||0);
          var frontPitch=deg((it.cfg.front&&it.cfg.front.pitch)||0);
          var geometry=new Marzipano.EquirectGeometry([{width:w}]);
          var source=Marzipano.ImageUrlSource.fromString(it.cfg.file);
          var view=new Marzipano.RectilinearView({yaw:frontYaw,pitch:frontPitch,fov:deg(60)}, makeLimiter(S,frontYaw));
          var marzScene=viewer.createScene({source:source,geometry:geometry,view:view,pinFirstLevel:true});

          it.view=view; it.marzScene=marzScene; it.frontPitch=frontPitch;
          if(it.motion==='zoom'){
            // Hold the centered front view; slowly push in from wide to close (no rotation).
            var zStart=clamp(ZWIDE, S.fovMin, S.fovMax);
            var zEnd  =clamp(zStart-ZOOMIN, S.fovMin, S.fovMax);
            it.panFrom=frontYaw; it.panTo=frontYaw;
            it.fovFrom=deg(zStart); it.fovTo=deg(zEnd);
          } else {
            // Slow yaw sweep across (an inset of) the allowed arc, alternating direction,
            // with a gentle push-in.
            var half = S.yawLimited ? deg(S.yawRange)/2*0.92 : deg(55);
            var dir  = (idx%2===0)?1:-1;
            var fovStart = clamp(70, S.fovMin, S.fovMax);
            var fovEnd   = clamp(fovStart-ZOOM, S.fovMin, S.fovMax);   // gentle push-in
            it.panFrom=frontYaw-dir*half; it.panTo=frontYaw+dir*half;
            it.fovFrom=deg(fovStart); it.fovTo=deg(fovEnd);
          }
          resolve(true);
        };
        img.onerror=function(){ resolve(false); };
        img.src=it.cfg.file;
      });
    }

    // Preload/build all scenes sequentially, then run the reel.
    var built=[];
    var chain=Promise.resolve();
    items.forEach(function(it,i){
      chain=chain.then(function(){
        splashDots.textContent='Loading panoramas… '+(i+1)+' / '+items.length;
        return buildItem(it,i).then(function(ok){ if(ok) built.push(it); });
      });
    });
    chain.then(function(){
      if(!built.length){ splashDots.textContent='Panoramas could not be loaded.'; return; }
      items=built;
      buildSegments(items.length);
      // Fade splash out, begin the loop.
      splashEl.classList.add('fade');
      setTimeout(function(){ splashEl.hidden=true; }, 800);
      run(items);
      showHint();
      requestWakeLock();
    });
  }

  // ------------------------------- Segments -------------------------------
  var segFills=[];
  function buildSegments(n){
    segsEl.innerHTML=''; segFills=[];
    for(var i=0;i<n;i++){
      var seg=document.createElement('div'); seg.className='seg';
      var f=document.createElement('span'); f.className='fill';
      seg.appendChild(f); segsEl.appendChild(seg); segFills.push(f);
    }
  }
  function setSegFills(current){
    for(var i=0;i<segFills.length;i++){ segFills[i].style.width = (i<current?'100%':'0%'); }
  }

  // ----------------------- Project name + QR (top left) -----------------------
  // Missing QR file → hide the card rather than show a broken image.
  qrImg.addEventListener('error', function(){ qrcardEl.hidden=true; });
  var lastTitle=null;
  function setProjectName(title, tourId){
    if(title===lastTitle) return;   // scenes within one tour keep the name/QR steady (no flicker)
    lastTitle=title;
    projectNameEl.style.opacity='0';
    qrcardEl.style.opacity='0';
    setTimeout(function(){
      projectNameEl.textContent=title; projectNameEl.style.opacity='1';
      if(tourId){ qrImg.src='qr/'+tourId+'.png'; qrcardEl.hidden=false; qrcardEl.style.opacity='1'; }
      else { qrcardEl.hidden=true; }
    }, 250);
  }

  // ------------------------------- Playback -------------------------------
  function run(list){
    var N=list.length, current=-1;
    var start=0, lastNow=0, paused=false, token=0;

    function playScene(i){
      current=i; token++; var myToken=token;
      var it=list[i];
      it.view.setYaw(it.panFrom); it.view.setPitch(it.frontPitch); it.view.setFov(it.fovFrom);
      it.marzScene.switchTo({transitionDuration:FADE_MS});
      setProjectName(it.tourTitle, it.tourId);
      setSegFills(i);
      start=0; lastNow=0;
      requestAnimationFrame(function loop(now){
        if(myToken!==token) return;                 // superseded by a skip/next
        if(!start){ start=now; lastNow=now; }
        if(paused){ start+=now-lastNow; lastNow=now; requestAnimationFrame(loop); return; }
        lastNow=now;
        var el=now-start;
        var t=clamp(el/PAN_MS,0,1);
        // Linear (constant-speed) motion — no easing, so nothing speeds up mid-pan.
        it.view.setYaw(lerp(it.panFrom,it.panTo,t));
        it.view.setPitch(it.frontPitch);
        it.view.setFov(lerp(it.fovFrom,it.fovTo,t));
        if(segFills[i]) segFills[i].style.width = clamp(el/(PAN_MS+HOLD_MS),0,1)*100+'%';
        if(el < PAN_MS+HOLD_MS){ requestAnimationFrame(loop); }
        else { playScene((i+1)%N); }                // loop forever
      });
    }

    // Controls (optional — handy for testing / manual kiosks)
    document.addEventListener('keydown',function(ev){
      if(ev.key===' '){ ev.preventDefault(); paused=!paused; pausedBadge.classList.toggle('show',paused); }
      else if(ev.key==='ArrowRight'){ paused=false; pausedBadge.classList.remove('show'); playScene((current+1)%N); }
      else if(ev.key==='ArrowLeft'){ paused=false; pausedBadge.classList.remove('show'); playScene((current-1+N)%N); }
      else if(ev.key==='f'||ev.key==='F'){ toggleFullscreen(); }
    });

    playScene(0);
  }

  // ------------------------------- Kiosk niceties -------------------------------
  var ENTER_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
  var EXIT_ICON ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
  function updateFsIcon(){ fsBtn.innerHTML = document.fullscreenElement ? EXIT_ICON : ENTER_ICON; }
  updateFsIcon();
  function toggleFullscreen(){
    try{
      var el=document.documentElement, p;
      if(!document.fullscreenElement){ if(el.requestFullscreen) p=el.requestFullscreen(); }
      else{ if(document.exitFullscreen) p=document.exitFullscreen(); }
      if(p && p.catch) p.catch(function(){});   // ignore blocked/no-gesture rejections
    }catch(e){}
  }
  fsBtn.addEventListener('click', function(ev){ ev.stopPropagation(); toggleFullscreen(); });
  document.addEventListener('fullscreenchange', updateFsIcon);
  document.addEventListener('click', toggleFullscreen);   // click anywhere else also toggles

  var hintTimer=null;
  function showHint(){
    hintEl.hidden=false;
    hintTimer=setTimeout(function(){ hintEl.classList.add('gone'); setTimeout(function(){ hintEl.hidden=true; },700); }, 4500);
  }

  // Hide the mouse cursor after a few idle seconds (kiosk look); reveal on move.
  var cursorTimer=null;
  function armCursorHide(){
    document.body.classList.remove('hide-cursor');
    clearTimeout(cursorTimer);
    cursorTimer=setTimeout(function(){ document.body.classList.add('hide-cursor'); }, 3000);
  }
  document.addEventListener('mousemove', armCursorHide);
  armCursorHide();

  // Keep the display awake (kiosk / smart-screen). Re-acquire when tab regains focus.
  var wakeLock=null;
  function requestWakeLock(){
    if(!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function(wl){ wakeLock=wl; }).catch(function(){});
  }
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') requestWakeLock(); });
})();
</script>
</body>
</html>
